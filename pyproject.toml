[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medium-mcp"
version = "0.1.0"
description = "MCP server exposing the Medium API as tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.23,<2",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "markdown>=3.5",
    "truststore>=0.9",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
medium-mcp = "medium_mcp.server:main"

[tool.setuptools]
packages = ["medium_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
